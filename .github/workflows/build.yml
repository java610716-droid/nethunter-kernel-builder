name: Build NetHunter Kernel

on:
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev liblz4-tool zip

      - name: Download Kernel Source & Toolchain
        run: |
          mkdir workspace
          cd workspace
          
          # Clone sarthakroy2002's RMX2020 kernel source (sixteen-qpr2 branch)
          git clone -b sixteen-qpr2 --depth=1 https://github.com/sarthakroy2002/kernel_realme_RMX2020.git kernel
          
          # Clone GCC ARM32 & ARM64 Cross-Compiler Toolchains
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Compile Kernel
        run: |
          cd workspace/kernel
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/../gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/../gcc32/bin/arm-linux-androideabi-
          
          # Configure for RMX2020 / RMX3171
          make RMX2020_defconfig
          
          # Start compilation using all available CPU threads
          make -j$(nproc --all)

      - name: Upload Output Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel
          path: |
            workspace/kernel/arch/arm64/boot/Image.gz*
            workspace/kernel/arch/arm64/boot/Image*
