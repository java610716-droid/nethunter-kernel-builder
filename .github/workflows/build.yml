- name: Disable Broken Kernel Features
        run: |
          cd workspace/kernel
          # Generate base config
          make O=out ARCH=arm64 RMX2020_defconfig
          
          # Disable problematic features causing build breaks
          scripts/config --file out/.config --disable CONFIG_UIFIRST
          scripts/config --file out/.config --disable CONFIG_UIFIRST_SCHED
          scripts/config --file out/.config --disable CONFIG_OPPO_HEALTHINFO
