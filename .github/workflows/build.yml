name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # Uses Ubuntu 20.04 to prevent host compiler syntax breaks on older kernel scripts

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev liblz4-tool zip ccache

      - name: Download Kernel Source & Toolchains
        run: |
          mkdir workspace
          cd workspace
          
          # Clone RMX2020 kernel source
          git clone -b sixteen-qpr2 --depth=1 https://github.com/sarthakroy2002/kernel_realme_RMX2020.git kernel
          
          # Clone GCC Cross-Compilers
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Compile Kernel
        run: |
          cd workspace/kernel
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Absolute paths for GCC toolchains
          export GCC64_DIR=$(pwd)/../gcc64/bin/aarch64-linux-android-
          export GCC32_DIR=$(pwd)/../gcc32/bin/arm-linux-androideabi-
          
          export CROSS_COMPILE=$GCC64_DIR
          export CROSS_COMPILE_ARM32=$GCC32_DIR
          export CROSS_COMPILE_COMPAT=$GCC32_DIR
          
          # Configure and build
          make O=out RMX2020_defconfig
          make -j$(nproc --all) O=out

      - name: Upload Output Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel
          path: |
            workspace/kernel/out/arch/arm64/boot/Image.gz*
            workspace/kernel/out/arch/arm64/boot/Image*
