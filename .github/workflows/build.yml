name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev liblz4-tool zip ccache

      - name: Download Kernel Source & Toolchains
        run: |
          mkdir workspace
          cd workspace
          
          # Clone RMX2020 kernel source
          git clone -b sixteen-qpr2 --depth=1 https://github.com/sarthakroy2002/kernel_realme_RMX2020.git kernel
          
          # Clone Proton Clang toolchain (includes LLVM & modern GCC binaries)
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Patch Yylloc DTC Host Compile Error
        run: |
          cd workspace/kernel
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true

      - name: Compile Kernel
        run: |
          cd workspace/kernel
          
          # Set up paths for Clang and target cross-compilers
          export PATH=$(pwd)/../clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          make RMX2020_defconfig
          make -j$(nproc --all)

      - name: Upload Output Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel
          path: |
            workspace/kernel/arch/arm64/boot/Image.gz*
            workspace/kernel/arch/arm64/boot/Image*
