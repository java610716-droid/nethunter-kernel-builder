name: Build NetHunter Kernel (Docker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04

    steps:
      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev liblz4-tool zip ccache

      - name: Download Source & Proton Clang
        run: |
          mkdir workspace
          cd workspace
          
          # Clone RMX2020 kernel source
          git clone -b sixteen-qpr2 --depth=1 https://github.com/sarthakroy2002/kernel_realme_RMX2020.git kernel
          
          # Clone Proton Clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Apply Source Code Fixes
        run: |
          cd workspace/kernel
          
          # 1. Patch Yylloc DTC Host Compile Error
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          
          # 2. Fix inline error in resmap_account.h
          sed -i 's/extern inline/static inline/g' include/linux/resmap_account.h || true
          
          # 3. Create missing header symlink for uifirst trace
          mkdir -p kernel/uifirst/
          if [ -f "kernel/uifirst/uifirst_sched_trace.h" ]; then
            cp kernel/uifirst/uifirst_sched_trace.h ./uifirst_sched_trace.h || true
          fi

      - name: Compile Kernel
        run: |
          cd workspace/kernel
          
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/../clang/bin:${PATH}"
          
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          export KCFLAGS="-fgnu89-inline -Wno-error=inline -I$(pwd)/kernel/uifirst"
          
          make RMX2020_defconfig
          make -j$(nproc)

      - name: Upload Output Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel-RMX2020
          path: |
            workspace/kernel/arch/arm64/boot/Image.gz*
            workspace/kernel/arch/arm64/boot/Image*
